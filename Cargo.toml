[package]
name = "remdb-server"
version = "0.1.0"
edition = "2024"

[dependencies]
remdb = { version = "0.1.16", default-features = true }
remdb-macros = "0.1.16"
rustyline = "12.0.0"
rustyline-derive = "0.11.0"
clap = { version = "4.5.0", features = ["derive"] }
thiserror = "1.0.58"
toml = "0.8.10"
serde = { version = "1.0.197", features = ["derive"] }
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = "0.1.14"
tokio-util = { version = "0.7.11", features = ["codec"] }
native-tls = "0.2.11"
tokio-native-tls = "0.3.1"
log = "0.4.21"
futures = "0.3.30"
