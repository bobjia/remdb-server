[package]
name = "remdb-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "remdb-server"
path = "src/main.rs"

[[bin]]
name = "remdbcli"
path = "src/remdbcli.rs"

[lib]
name = "remdb_server"
path = "src/lib.rs"

[dependencies]
remdb = { version = "0.1.22", default-features = true }
remdb-macros = "0.1.22"
rustyline = "12.0.0"
rustyline-derive = "0.11.0"
clap = { version = "4.5.0", features = ["derive"] }
thiserror = "1.0.58"
toml = "0.8.10"
serde = { version = "1.0.197", features = ["derive"] }
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = "0.1.14"
tokio-util = { version = "0.7.11", features = ["codec"] }
native-tls = "0.2.11"
tokio-native-tls = "0.3.1"
log = "0.4.21"
futures = "0.3.30"
sha2 = "0.10.8"
hex = "0.4.3"
