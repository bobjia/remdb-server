[package]
name = "remdb-server"
version = "0.4.2"
edition = "2024"

[[bin]]
name = "remdb-server"
path = "src/main.rs"

[[bin]]
name = "remdbcli"
path = "src/remdbcli.rs"

[lib]
name = "remdb_server"
path = "src/lib.rs"

[dependencies]
remdb = { version = "0.4.2", default-features = true, features = ["model-runtime"] }
rustyline = "12.0.0"
rustyline-derive = "0.11.0"
clap = { version = "4.5.0", features = ["derive"] }
thiserror = "1.0.58"
toml = "0.8.10"
serde = { version = "1.0.197", features = ["derive"] }
tokio = { version = "1.37.0", features = ["full", "rt-multi-thread"] }
tokio-stream = "0.1.14"
tokio-util = { version = "0.7.11", features = ["codec"] }
native-tls = "0.2.11"
tokio-native-tls = "0.3.1"
log = "0.4.21"
futures = "0.3.30"
sha2 = "0.10.8"
hex = "0.4.3"
rand = "0.8.5"
ctrlc = "3.4.1"

# 高性能架构依赖
prost = "0.12"
tonic = "0.10"
bytes = "1.5"
crossbeam = "0.8"
dashmap = "5.5"
parking_lot = "0.12"
bincode = "1.3"
lz4 = "1.24"
ahash = "0.8"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
atomic_refcell = "0.1"
num_cpus = "1.16"

# 网络和序列化
prost-derive = "0.12"
tokio-tungstenite = "0.20"
flume = "0.10"

# 性能监控
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# JSON序列化
serde_json = "1.0"

# 系统监控
sysinfo = "0.29.0"

# Web服务
warp = "0.3.6"

# 多线程处理
rayon = "1.8.0"

# 系统调用
nix = { version = "0.28.0", features = ["user"] }
libc = "0.2"

[build-dependencies]
prost-build = "0.12"

[features]
# 零拷贝网络传输支持
zerocopy = []

# Debian 打包配置 (cargo-deb)
[package.metadata.deb]
name = "remdb-server"
maintainer = "remdb Team <support@remdb.dev>"
copyright = "2024 remdb Team"
license-file = "LICENSE"
extended-description = """\
remdb-server is a high-performance embedded in-memory database server \
with ACID transactions, SQL execution, vector indexes, time-series storage, \
JSON document store, RBAC, PubSub, HA replication, and ONNX model inference.

This package contains the remdb-server daemon and the remdbcli CLI tool.
"""
section = "database"
priority = "optional"
assets = [
    ["target/release/remdb-server", "usr/bin/", "755"],
    ["target/release/remdbcli", "usr/bin/", "755"],
    ["remdb-master.toml", "usr/share/remdb/", "644"],
    ["remdb-slave.toml", "usr/share/remdb/", "644"],
    ["schema.ddl", "usr/share/remdb/schema/", "644"],
    ["README.md", "usr/share/doc/remdb-server/", "644"],
    ["LICENSE", "usr/share/doc/remdb-server/", "644"],
    ["SPEC.md", "usr/share/doc/remdb-server/", "644"],
    ["PERFORMANCE_TUNING.md", "usr/share/doc/remdb-server/", "644"],
    ["packaging/remdb-server.service", "lib/systemd/system/", "644"],
    ["packaging/remdb-server.default", "etc/remdb/", "644"],
    ["packaging/install.sh", "usr/share/remdb/", "755"],
]
depends = "$auto"
maintainer-scripts = "packaging/debian/"
