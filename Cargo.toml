[package]
name = "remdb-server"
version = "0.1.0"
edition = "2024"

[dependencies]
remdb = { version = "0.1.15", default-features = true }
remdb-macros = "0.1.15"
rustyline = "12.0.0"
rustyline-derive = "0.11.0"
clap = { version = "4.5.0", features = ["derive"] }
thiserror = "1.0.58"
toml = "0.8.10"
serde = { version = "1.0.197", features = ["derive"] }
