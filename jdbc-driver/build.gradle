plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.remdb'
version = '0.1.0'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'RemDb JDBC Driver',
            'Implementation-Version': version,
            'Main-Class': 'com.remdb.jdbc.RemDbJdbcExample'
        )
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}

// 用于编译和打包JDBC驱动的任务
task buildJdbcDriver(type: Jar) {
    archiveBaseName.set('remdb-jdbc-driver')
    archiveVersion.set(version)
    from sourceSets.main.output
    manifest {
        attributes(
            'Implementation-Title': 'RemDb JDBC Driver',
            'Implementation-Version': version,
            'Main-Class': 'com.remdb.jdbc.RemDbJdbcExample'
        )
    }
}

// 运行示例程序的任务
task runExample(type: JavaExec) {
    main = 'com.remdb.jdbc.RemDbJdbcExample'
    classpath = sourceSets.main.runtimeClasspath
}
