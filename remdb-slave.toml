# remdb-server 配置文件示例

# DDL文件路径
ddl = ""

# 快照文件路径
snapshot_dir = "./slave-db/snapshot"
# 快照类型：full（全量）或incremental（增量）
# IMPORTANT: Use "full" periodically to create base snapshots for recovery!
snapshot_type = "full"
# 快照周期（秒）
snapshot_interval = 3600
# 最大保留的增量快照数量
max_incremental_snapshots = 10

# 数据库总内存大小（字节），默认100MB
total_memory = 104857600

# 是否支持低功耗模式，默认true
low_power_mode_supported = false

# 低功耗模式下的最大记录数，默认None
low_power_max_records = 10000

# 单表的最大记录数（用于动态创建表）
default_max_records = 10000



# WAL配置
[wal]
# 日志文件路径
log_path = "./slave-db/wal"
# 日志模式，可选值：async, sync
log_mode = "async"
# 检查点间隔（毫秒），默认30000
checkpoint_interval_ms = 30000
# 日志文件大小限制（字节），默认16MB
log_file_size_limit = 16777216
# 日志预分配大小（字节），默认4MB
log_prealloc_size = 4194304
# 日志段大小（字节），默认16MB
log_segment_size = 16777216
# 保留的检查点数量，默认3
retained_checkpoints = 3

# JDBC服务配置
# 是否启用JDBC服务
jdbc_enabled = true
# JDBC监听端口，默认6666
jdbc_port = 8666
# 最大允许的并发jdbc客户端连接数，默认5
max_connections = 5

# JDBC执行超时时间（秒），默认5秒
jdbc_timeout = 5

# JDBC认证配置
# 是否启用JDBC认证
jdbc_auth_enabled = true
# JDBC认证用户名
jdbc_username = "root"
# JDBC认证密码（SHA-256哈希值）
jdbc_password_hash = "4813494d137e1631bba301d5acab6e7bb7aa74ce1185d456565ef51d737677b2"

# 通过配置文件启用PubSub功能
[pubsub]
enabled = false
udp_bind_address = "0.0.0.0:6667"
heartbeat_interval = 2000
retransmission_timeout = 1000
max_retransmissions = 5

# 高可用配置示例
[ha]
# 是否启用高可用功能
enabled = true

# 节点ID
node_id = "2"

# 节点角色（master/slave）
role = "slave"

# 复制模式（async/sync）
replication_mode = "async"

# 心跳间隔（毫秒）
heartbeat_interval = 1000

# 故障检测时间（毫秒）
failure_detection_ms = 5000

# 同步超时时间（毫秒）
sync_timeout_ms = 2000

# 主节点地址（仅slave节点需要）
master_address = "127.0.0.1"

# 主节点端口（复制管理器使用端口，仅slave节点需要）
master_port = 6668

# 复制端口（用于WAL日志复制和数据同步）
replication_port = 6668